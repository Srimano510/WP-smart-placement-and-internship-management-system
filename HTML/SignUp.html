
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-950 via-blue-900 to-indigo-950 text-white">

    <div class="min-h-screen flex justify-center items-center px-4 py-8">

        <form action="/PlacementSystem/SignupServlet"
              method="post"
              id="signupForm"
              class="w-full max-w-lg rounded-xl border border-white/30
                     bg-blue-950/80 p-8 shadow-2xl">

            <h1 class="text-3xl font-bold text-center mb-2">
                Student Registration
            </h1>

            <p class="text-center text-blue-200 mb-8">
                Enter your details to create your account
            </p>

            <!-- Roll Number -->
            <div class="mb-5">
                <label for="roll_no" class="block mb-2 font-semibold">
                    Roll Number
                </label>
                <input type="text"
                       id="roll_no"
                       name="roll_no"
                       placeholder="Enter your roll number"
                       maxlength="20"
                       required
                       class="w-full rounded-md bg-white p-3 text-black border-2 border-blue-300">
            </div>

            <!-- Name -->
            <div class="mb-5">
                <label for="name" class="block mb-2 font-semibold">
                    Full Name
                </label>
                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your full name"
                       maxlength="100"
                       required
                       pattern="[A-Za-z][A-Za-z .'-]*"
                       title="Enter a valid name using letters, spaces, apostrophes, periods, or hyphens."
                       class="w-full rounded-md bg-white p-3 text-black border-2 border-blue-300">
            </div>

            <!-- Email -->
            <div class="mb-5">
                <label for="email" class="block mb-2 font-semibold">
                    Student Email
                </label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your student email"
                       maxlength="100"
                       required
                       class="w-full rounded-md bg-white p-3 text-black border-2 border-blue-300">
            </div>

            <!-- Password -->
            <div class="mb-5">
                <label for="password" class="block mb-2 font-semibold">
                    Password
                </label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Create a password"
                       minlength="8"
                       maxlength="72"
                       pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,72}"
                       title="Use 8–72 characters with uppercase, lowercase, a number, and a special character."
                       required
                       class="w-full rounded-md bg-white p-3 text-black border-2 border-blue-300">

                <p class="text-sm text-blue-200 mt-2">
                    At least 8 characters, including uppercase, lowercase,
                    a number, and a special character.
                </p>
            </div>

            <!-- Department -->
            
<!-- Department -->
            <div class="mb-5">
                <label for="department" class="block mb-2 font-semibold">
                Department
                </label>

                <input type="text"
                    id="department"
                    name="department"
                    placeholder="Enter your department"
                    maxlength="50"
                    required
                    class="w-full rounded-md bg-white p-3 text-black border-2 border-blue-300">
            </div>

            <!-- CGPA -->
            <div class="mb-7">
                <label for="gpa" class="block mb-2 font-semibold">
                    CGPA
                </label>
                <input type="number"
                       id="gpa"
                       name="gpa"
                       placeholder="Enter CGPA (0–10)"
                       min="0"
                       max="10"
                       step="0.01"
                       required
                       class="w-full rounded-md bg-white p-3 text-black border-2 border-blue-300">
            </div>

            <button type="submit"
                    class="w-full rounded-md bg-sky-500 hover:bg-sky-600
                           p-3 font-bold text-white transition">
                Create Account
            </button>

            <p class="text-center mt-5 text-sm">
                Already registered?
                <a href="LoginStudent.html"
                   class="text-sky-300 underline hover:text-white">
                    Log in
                </a>
            </p>

        </form>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", function (event) {
            const cgpa = Number(document.getElementById("gpa").value);

            if (cgpa < 0 || cgpa > 10) {
                event.preventDefault();
                alert("CGPA must be between 0 and 10.");
                return;
            }

            const password = document.getElementById("password").value;
            const passwordPattern =
                /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,72}$/;

            if (!passwordPattern.test(password)) {
                event.preventDefault();
                alert("Password must have uppercase, lowercase, a number, and a special character.");
            }
        });
    </script>

</body>
</html>
