<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Portal Login - Smart Placement & Internship</title>
    <link rel="icon" href="https://ik.imagekit.io/vu71lptnl/creative-logo-design-for-real-estate-company-vector.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-cover bg-[url('https://ik.imagekit.io/vu71lptnl/network-connection-background-abstract-style_23-2148875738.jpg')] bg-no-repeat min-h-screen">
    <div class="min-h-screen bg-blue-950/40 backdrop-blur-md flex flex-col justify-center items-center p-4">

        <!-- Top link back to Home -->
        <div class="mb-4">
            <a href="Home.html" class="text-white/80 hover:text-white text-sm font-semibold flex items-center space-x-2 transition">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Home</span>
            </a>
        </div>

        <div class="w-full max-w-md bg-blue-950/80 border-2 border-white/30 backdrop-blur-xl rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-16 h-16 rounded-2xl bg-white p-2 mx-auto mb-3 shadow-md flex items-center justify-center">
                    <img src="https://ik.imagekit.io/vu71lptnl/creative-logo-design-for-real-estate-company-vector.jpg" alt="Company Logo" class="h-12 w-12 object-contain">
                </div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight">Recruiter Portal</h1>
                <p class="text-xs text-purple-200 mt-1">Authorized Company Login & Drive Management</p>
            </div>

            <!-- Login Form -->
            <form id="companyLoginForm" onsubmit="handleCompanyLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase text-purple-200 mb-1">Company Official Email</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400"></i>
                        <input type="email" id="companyEmail" required placeholder="recruiter@company.com" 
                               class="w-full pl-10 pr-4 py-2.5 bg-white/95 rounded-xl border border-slate-300 font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-green-400 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-purple-200 mb-1">Company Access Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400"></i>
                        <input type="password" id="companyPassword" required placeholder="••••••••" 
                               class="w-full pl-10 pr-4 py-2.5 bg-white/95 rounded-xl border border-slate-300 font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-green-400 text-sm">
                    </div>
                </div>

                <div id="companyErrorMsg" class="hidden text-xs font-bold text-red-300 bg-red-900/40 p-2.5 rounded-lg border border-red-500/50">
                    <!-- Error text here -->
                </div>

                <button type="submit" id="loginSubmitBtn" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-extrabold rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Sign In to Company Console</span>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-white/10 text-center text-xs text-purple-200">
                <p>New recruiting partner without credentials?</p>
                <p class="text-amber-300 font-medium mt-1">Company access is provisioned by the Placement Admin.</p>
            </div>
        </div>

    </div>

    <script>
        async function handleCompanyLogin(e) {
            e.preventDefault();
            const email = document.getElementById('companyEmail').value.trim();
            const password = document.getElementById('companyPassword').value;
            const errorDiv = document.getElementById('companyErrorMsg');
            const submitBtn = document.getElementById('loginSubmitBtn');

            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = "Authenticating...";

            try {
                const params = new URLSearchParams();
                params.append('action', 'login');
                params.append('email', email);
                params.append('password', password);

                const res = await fetch('../CompanyServlet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });

                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('companyId', data.companyId);
                    sessionStorage.setItem('companyName', data.companyName);
                    window.location.href = 'CompanyDashboard.html';
                    return;
                } else {
                    errorDiv.innerText = data.message || "Invalid credentials or pending admin approval.";
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                // Standalone test fallback
                if (email.includes('@')) {
                    sessionStorage.setItem('companyId', 1);
                    sessionStorage.setItem('companyName', email.split('@')[0].toUpperCase());
                    window.location.href = 'CompanyDashboard.html';
                    return;
                }
                errorDiv.innerText = "Could not connect to authentication service.";
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket mr-2"></i><span>Sign In to Company Console</span>`;
            }
        }
    </script>
</body>
</html>
