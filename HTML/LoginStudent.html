<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="max-w-[100%] h-screen">
        <div class="bg-cover bg-[url('https://ik.imagekit.io/vu71lptnl/network-connection-background-abstract-style_23-2148875738.jpg')] bg-no-repeat">
            <div class="bg-blue-950/10 backdrop-blur-md">
            <form action="Student.html" class="h-screen flex flex-col items-center" id="form">
                <div class="p-15 rounded-lg border-2 border-white/30 bg-blue-950/70 backdrop-blur-md mt-7 shadow-2xl">
                    <p class="text-[30px] text-center font-[Pacifico] text-white font-bold">Student Login</p>
                    <p class="text-white ml-9 mt-3">Access your account to continue</p>
                    <div class="flex flex-col mt-10">
                        <input type="text" id="email" name="email" placeholder="Enter your email"  class="border-black border-2 font-bold rounded-sm bg-white w-75 h-10 p-5">
                        <p id="emailError" class="text-red-500 font-bold"></p>
                    </div>
                    <div class="flex flex-col mt-10">
                        <input type="password" id="password" name="password" placeholder="Enter your password"  class="border-2 font-bold rounded-sm w-75 bg-white h-10 p-5">
                        <p id="passwordError" class="text-red-500 font-bold"></p>
                    </div>
                    <div class="pt-10">
                        <button id="btnIn" class="px-30 py-3 bg-green-700 font-bold text-white border-2 border-black rounded-lg">Sign in</button>
                    </div>
                    <p class="flex flex-row justify-evenly mt-5 ml-3 text-white">Don't have an account?<a class="text-sky-400" href="">Register</a></p>
                </div>
            </form>
            </div>
        </div>
    </div>
    <script>
            let form = document.getElementById('form')
            let email = document.getElementById('email')
            let emailError = document.getElementById('emailError')
            let password = document.getElementById('password')
            let passwordError = document.getElementById('passwordError')

            let em = false, pw = false

            form.addEventListener("submit",(e)=>{
                if(!em || !pw){
                    e.preventDefault()
                }
            })

            email.addEventListener("input",(e) => {
                const regex = /^\d{10}@student\.annauniv\.edu$/
                if(e.target.value == ""){
                    emailError.textContent = "Email should not be empty";
                    email.classList.remove("bg-green-300","bg-white");
                    email.classList.add("bg-red-300");
                    emailError.classList.remove("text-green-500")
                    emailError.classList.add("text-red-500")
                    em = false
                }
                else if(!e.target.value.match(regex)){
                    emailError.textContent = "Email should not be in the format"
                    email.classList.remove("bg-green-300","bg-white");
                    email.classList.add("bg-red-300");
                    emailError.classList.remove("text-green-500")
                    emailError.classList.add("text-red-500")
                    em = false
                }
                else{
                    emailError.textContent = "Looks good"
                    email.classList.remove("bg-red-300","bg-white")
                    email.classList.add("bg-green-300")
                    emailError.classList.remove("text-red-500")
                    emailError.classList.add("text-green-500")
                    em = true
                }
            })

            password.addEventListener("input",(e)=>{
                const len = /^.{8,}$/
                const upper = /[A-Z]/
                const lower = /[a-z]/
                const digit = /[0-9]/
                const splchar = /[^A-Za-z0-9]/

                if(e.target.value == ""){
                    passwordError.textContent = "Password should not be empty"
                    password.classList.remove("bg-green-300","bg-white")
                    password.classList.add("bg-red-300")
                    passwordError.classList.remove("text-green-500")
                    passwordError.classList.add("text-red-500")
                    pw = false
                }
                else if(!e.target.value.match(len)){
                    passwordError.textContent = "Atleast 8 characters"
                    password.classList.remove("bg-green-300","bg-white")
                    password.classList.add("bg-red-300")
                    passwordError.classList.remove("text-green-500")
                    passwordError.classList.add("text-red-500")
                    pw = false
                }
                else if(!e.target.value.match(upper)){
                    passwordError.textContent = "Atleast 1 upper case"
                    password.classList.remove("bg-green-300","bg-white")
                    password.classList.add("bg-red-300")
                    passwordError.classList.remove("text-green-500")
                    passwordError.classList.add("text-red-500")
                    pw = false
                }
                else if(!e.target.value.match(lower)){
                    passwordError.textContent = "Atleast 1 lower case"
                    password.classList.remove("bg-green-300","bg-white")
                    password.classList.add("bg-red-300")
                    passwordError.classList.remove("text-green-500")
                    passwordError.classList.add("text-red-500")
                    pw = false
                }
                else if(!e.target.value.match(digit)){
                    passwordError.textContent = "Atleast 1 digit"
                    password.classList.remove("bg-green-300","bg-white")
                    password.classList.add("bg-red-300")
                    passwordError.classList.remove("text-green-500")
                    passwordError.classList.add("text-red-500")
                    pw = false
                }
                else if(!e.target.value.match(splchar)){
                    passwordError.textContent = "Atleast 1 special character"
                    password.classList.remove("bg-green-300","bg-white")
                    password.classList.add("bg-red-300")
                    passwordError.classList.remove("text-green-500")
                    passwordError.classList.add("text-red-500")
                    pw = false
                }
                else{
                    passwordError.textContent = "Looks good"
                    password.classList.remove("bg-red-300","bg-white")
                    password.classList.add("bg-green-300")
                    passwordError.classList.remove("text-red-500")
                    passwordError.classList.add("text-green-500")
                    pw = true
                }
            })
    </script>
</body>
</html>
